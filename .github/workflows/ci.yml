name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asistente_viajes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/asistente_viajes_test
      LLM_PROVIDER: gemini
      GEMINI_MODEL: gemini-3.5-flash-lite
      # Valor ficticio a proposito: ningun test toca la red ni consume cuota.
      GEMINI_API_KEY_1: clave-ficticia-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Habilitar la extension pgvector
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d asistente_viajes_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Aplicar el esquema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d asistente_viajes_test \
            -f sql/001_schema.sql

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tests
        run: pytest -v

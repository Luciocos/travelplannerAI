name: secretos

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  secretos:
    name: secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo con gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Nota: gitleaks-action es gratuito para repos personales y publicos.
        # Si el repo pertenece a una organizacion pide GITLEAKS_LICENSE.
        # En ese caso, borrar este step y dejar solo el guard de abajo.

      - name: Guard explicito contra claves de Gemini y archivos .env
        run: |
          falla=0

          if git grep -nE 'AQ\.[A-Za-z0-9_-]{20,}' -- . ':(exclude).github/workflows'; then
            echo "::error::Hay algo con forma de clave de Gemini en el repo."
            falla=1
          fi

          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':(exclude).github/workflows'; then
            echo "::error::Hay algo con forma de API key de Google en el repo."
            falla=1
          fi

          if git ls-files | grep -qxE '\.env'; then
            echo "::error::El archivo .env esta versionado. Sacalo del indice."
            falla=1
          fi

          if git ls-files '*.ipynb' | xargs -r grep -lE 'AQ\.[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}'; then
            echo "::error::Hay una clave en el output de un notebook."
            falla=1
          fi

          exit $falla

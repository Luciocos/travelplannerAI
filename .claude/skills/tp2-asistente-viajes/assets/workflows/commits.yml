name: commits

on:
  pull_request:
    branches: [main]

jobs:
  commits:
    name: commits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar mensajes de commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          falla=0

          while IFS= read -r sha; do
            asunto=$(git log -1 --format=%s "$sha")
            cuerpo=$(git log -1 --format=%B "$sha")

            if echo "$cuerpo" | grep -qiE '^Co-Authored-By:'; then
              echo "::error::$sha lleva un trailer Co-Authored-By: $asunto"
              falla=1
            fi

            if echo "$cuerpo" | grep -qiE 'generated with|claude code|noreply@anthropic'; then
              echo "::error::$sha menciona la herramienta generadora: $asunto"
              falla=1
            fi

            if ! echo "$asunto" | grep -qE '^(feat|fix|docs|test|refactor|data|ci|chore)(\([a-z-]+\))?: .+'; then
              echo "::error::$sha no respeta el formato tipo(alcance): descripcion -> $asunto"
              falla=1
            fi
          done < <(git rev-list "$base..$head")

          exit $falla

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asistente_viajes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asistente_viajes
    ports:
      - "5432:5432"
    volumes:
      - asistente_viajes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  asistente_viajes_pgdata:

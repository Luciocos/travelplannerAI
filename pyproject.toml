[project]
name = "asistente-viajes"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "db: marca tests que necesitan una base Postgres real (docker compose up -d)",
]
